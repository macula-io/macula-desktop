[package]
name = "macula-desktop"
version = "0.1.0"
description = "Desktop GUI for the Macula mesh: Tauri shell over the macula-rust SDK"
edition = "2021"

[lib]
name = "macula_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The published SDK crate -- the ONLY macula-io dependency, per the
# exploration doc's constraint (SDKs only, no lazymesh/macula-cli).
macula-rust = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The chat module's LLM calls (OpenAI-compatible endpoint) -- made from
# the Rust core, never the webview. Streams SSE deltas to the UI as
# Tauri events.
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
# The mesh link runs on its own thread with its own tokio runtime
# (macula-rust/quinn need one; tauri's own async runtime is separate).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }

[profile.release]
strip = true
lto = true

# Keep dev builds lean: full debug info for ~500 transitive crates
# (Tauri + WebKitGTK stack) makes target/ grow to gigabytes. Panics
# still carry line numbers in release mode; dev backtraces lose them.
[profile.dev]
debug = 0
