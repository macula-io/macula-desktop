<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" role="img" aria-label="macula-desktop system context">
<title>macula-desktop system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="860"/>
<rect class="b-per" x="365" y="30" width="270" height="96" rx="10"/>
<circle class="head" cx="391" cy="54" r="9"/>
<text class="t-name" x="409" y="58">Operator</text>
<text class="t-type" x="409" y="76">[Person]</text>
<text class="t-desc" x="381" y="100">Runs the app on Linux, macOS or</text>
<text class="t-desc" x="381" y="116">Windows; keyboard first</text>
<rect class="b-ext" x="690" y="30" width="270" height="96" rx="10"/>
<text class="t-name" x="706" y="58">GitHub Releases</text>
<text class="t-type" x="706" y="76">[External system]</text>
<text class="t-desc" x="706" y="100">One archive per OS and</text>
<text class="t-desc" x="706" y="116">SHA256SUMS; install.sh checks it</text>
<rect class="b-ext" x="40" y="200" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="228">LLM endpoint</text>
<text class="t-type" x="56" y="246">[External: OpenAI-compatible]</text>
<text class="t-desc" x="56" y="270">The chat agent's model. DeepSeek</text>
<text class="t-desc" x="56" y="286">by default; MACULA_LLM_BASE_URL</text>
<text class="t-desc" x="56" y="302">and MACULA_LLM_MODEL override</text>
<rect class="b-sys" x="365" y="200" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="228">macula-desktop</text>
<text class="t-type" x="381" y="246">[Tauri 2 app, one executable]</text>
<text class="t-desc" x="381" y="270">A mesh node with a window: Mesh,</text>
<text class="t-desc" x="381" y="286">Chat, Teams, Services, Realms tabs;</text>
<text class="t-desc" x="381" y="302">tray mode keeps its presence</text>
<rect class="b-ext" x="690" y="200" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="228">System browser</text>
<text class="t-type" x="706" y="246">[External system]</text>
<text class="t-desc" x="706" y="270">Opens an application's http(s)</text>
<text class="t-desc" x="706" y="286">URL the operator declared; the</text>
<text class="t-desc" x="706" y="302">webview itself never does</text>
<rect class="b-mac" x="40" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="458">io.macula realm</text>
<text class="t-type" x="56" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="56" y="500">The commons realm. Its public key</text>
<text class="t-desc" x="56" y="516">is compiled in (io_macula.rs) and</text>
<text class="t-desc" x="56" y="532">every provider is checked against it</text>
<rect class="b-mac" x="365" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="458">Macula fleet stations</text>
<text class="t-type" x="381" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="381" y="500">Six stations, each pinned by the</text>
<text class="t-desc" x="381" y="516">node_id it must prove; route</text>
<text class="t-desc" x="381" y="532">pub/sub, calls and the DHT</text>
<rect class="b-ext" x="690" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="458">Other mesh agents</text>
<text class="t-type" x="706" y="476">[External systems]</text>
<text class="t-desc" x="706" y="500">Nodes beating on agent.hello</text>
<text class="t-desc" x="706" y="516">(macula-mcp sessions and others):</text>
<text class="t-desc" x="706" y="532">the roster, lobby and rooms</text>
<rect class="b-ext" x="365" y="640" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="668">Mesh services</text>
<text class="t-type" x="381" y="686">[External systems, mcl-*]</text>
<text class="t-desc" x="381" y="710">Procedures in the operating realm:</text>
<text class="t-desc" x="381" y="726">mcl-rag/answer_query and</text>
<text class="t-desc" x="381" y="742">add_knowledge for chat memory</text>
<path class="edge" d="M500 126V200" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="168">uses: window, tray</text>
<path class="edge" d="M635 78H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="70" text-anchor="middle">fetches</text>
<path class="edge" d="M365 260H310" marker-end="url(#a)"/>
<text class="t-rel" x="337" y="250" text-anchor="middle">HTTPS,</text>
<text class="t-rel" x="337" y="282" text-anchor="middle">SSE</text>
<path class="edge" d="M635 260H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="250" text-anchor="middle">opens</text>
<text class="t-rel" x="662" y="282" text-anchor="middle">a URL</text>
<path class="edge" d="M560 320V430" marker-end="url(#a)"/>
<text class="t-rel" x="568" y="368">QUIC pool, wire 1.0,</text>
<text class="t-rel" x="568" y="384">pq_hybrid node.key</text>
<path class="edge" d="M420 320V375H175V430" marker-end="url(#a)"/>
<text class="t-rel" x="250" y="367">pins its key</text>
<path class="edge" d="M635 490H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="480" text-anchor="middle">pub/sub</text>
<text class="t-rel" x="662" y="512" text-anchor="middle">relay</text>
<path class="edge" d="M500 550V640" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="600">calls by direct dial, operating realm</text>
<rect class="b-sys" x="24" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="827">In scope</text>
<rect class="b-per" x="110.8" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="827">Person</text>
<rect class="b-mac" x="184.39999999999998" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="827">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="827">External system</text>
<rect class="b-cmp" x="490.0" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="827">Container or component</text>
<rect class="b-later" x="669.2" y="815" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="827">Planned, not built</text>
</svg>
