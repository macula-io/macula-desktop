name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies (WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --locked

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warnings denied)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  lint-nesting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-28
          components: rustc-dev,llvm-tools-preview

      - name: Install dylint tooling
        run: |
          curl -LsSf https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz | tar xzf - -C ~/.cargo/bin
          cargo binstall -y cargo-dylint dylint-link

      - name: Run the nesting-depth lint (deny level, fails the build)
        working-directory: linting
        run: |
          cargo build --locked
          cp target/debug/libmax_nesting_depth.so "target/debug/libmax_nesting_depth@nightly-2026-05-28-x86_64-unknown-linux-gnu.so"
          cargo dylint --manifest-path ../src-tauri/Cargo.toml \
            --lib-path "target/debug/libmax_nesting_depth@nightly-2026-05-28-x86_64-unknown-linux-gnu.so" \
            --all
